[package]
name = "gitbridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "GitBridge"
path = "src/main.rs"

[dependencies]
gitbridge-core = { path = "../gitbridge-core" }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
rfd = "0.18"
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
