[package]
name = "gitbridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "GitBridge"
path = "src/main.rs"

[dependencies]
gitbridge-core = { path = "../gitbridge-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
